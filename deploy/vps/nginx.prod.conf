# =============================================================================
# HelpDeskPro — production nginx (runs INSIDE the frontend container on the VPS)
# =============================================================================
# Mounted to /etc/nginx/conf.d/default.conf. Keeps everything from
# repo/frontend/nginx.conf and adds the ACME challenge + the 80->443 redirect.
#
# Upstreams are reached through VARIABLES with Docker's embedded resolver, so
# nginx boots even when the backend container is not up yet (a literal upstream
# makes nginx abort at startup with "host not found in upstream" — during a
# cutover that would leave the site down instead of returning 502).
# =============================================================================

# --- HTTP :80 — ACME first, then redirect everything else -------------------
server {
    listen      80;
    listen [::]:80;
    server_name helpdesk.4d-gile.com;

    # MUST come before the redirect: certbot's webroot challenge is fetched
    # over plain HTTP, and a 301 would break renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Container HEALTHCHECK target. frontend/Dockerfile:46 runs
    #   wget -qO- http://127.0.0.1:80/healthz
    # so this MUST stay on :80 and MUST NOT be redirected, or the container is
    # permanently (unhealthy) and the cutover loses its go/no-go signal.
    # An exact-match location outranks the `location /` prefix regardless of order.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 -------------------------------------------------------------
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name helpdesk.4d-gile.com;

    # Existing certificate paths, unchanged. /etc/letsencrypt is mounted :ro.
    ssl_certificate     /etc/letsencrypt/live/helpdesk.4d-gile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.4d-gile.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required for the variable upstreams below.
    resolver 127.0.0.11 ipv6=off valid=30s;

    server_tokens off;
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;

    # Attachment uploads pass through here. NOTE: Spring's unconfigured
    # multipart defaults (1MB/file, 10MB/request) are the real ceiling.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Spring Boot API ---------------------------------------------------
    # All controllers are mapped under /api/** and no context-path is set, so
    # the /api prefix must reach Spring UNCHANGED. $request_uri preserves the
    # path and percent-encoding (attachment filenames depend on it).
    # Do NOT add a trailing slash to proxy_pass and do NOT rewrite here.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Flask agent2 ------------------------------------------------------
    # Prefix stripped: the frontend calls ${FLASK_URL}/agent2/... so Flask must
    # receive /agent2/... . agent2-api is reachable as `agent2` on helpdesk-net.
    location /ai/ {
        set $agent2_upstream http://agent2:5002;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $agent2_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;    # agent2 streams (SSE)
    }

    # --- hashed Vite assets ------------------------------------------------
    # add_header is not inherited once a location declares its own, so the
    # security headers are repeated here deliberately.
    location /assets/ {
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"                             always;
        add_header X-Frame-Options        "SAMEORIGIN"                          always;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
