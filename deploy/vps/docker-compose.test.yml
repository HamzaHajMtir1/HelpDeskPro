# =============================================================================
# HelpDeskPro — PHASE 2 validation stack (OVH VPS)  — production untouched
# =============================================================================
# Lives at /opt/helpdeskpro/docker-compose.test.yml. Throwaway: its database is
# a COPY restored from the backup dump, never the production volume.
#
#   docker compose --env-file .env.validate -f docker-compose.test.yml up -d db
#   ...restore the dump, verify row counts...
#   docker compose --env-file .env.validate -f docker-compose.test.yml up -d backend frontend
#
# --env-file is MANDATORY. Without it Compose interpolates from the project
# directory's .env — i.e. the PRODUCTION /opt/helpdeskpro/.env — so this
# throwaway stack would boot with the production JWT secret and the production
# OVH mailbox: validation traffic would send real email, and tokens it mints
# would be accepted by production after cutover.
#
# Only port 8081 is published. 80/443/8080/85/5002/3306/8090 are left alone.
# =============================================================================

name: helpdesk-test

services:
  # Throwaway copy of production data. postgres:16 (Debian/glibc) on purpose —
  # NOT alpine: the dump was produced by glibc collation and musl would risk
  # silent index corruption.
  db:
    image: postgres:16
    container_name: helpdesk-test-db
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
      helpdesk-test-net:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./repo/backend
      dockerfile: Dockerfile
    image: helpdeskpro-backend:test
    container_name: helpdesk-test-backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # application-prod.properties (commit 4d1308f) declares these THREE with
      # NO default. Passing only DB_PASSWORD reproduces the exact
      # unresolvable-placeholder crash that has kept the backend down.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 32 chars)}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      AGENT2_URL: ${AGENT2_URL:?AGENT2_URL is required}
    volumes:
      - ./test-uploads:/app/uploads
    networks:
      helpdesk-test-net:
        aliases: [backend]

  frontend:
    build:
      context: ./repo/frontend
      dockerfile: Dockerfile
    image: helpdeskpro-frontend:test
    container_name: helpdesk-test-frontend
    restart: "no"
    depends_on:
      - backend
    # Mount the PRODUCTION nginx config and run as root, exactly as the cutover
    # will. Without this the test serves the image-baked frontend/nginx.conf,
    # which already has /healthz on :80 — so a defect in nginx.prod.conf passes
    # Phase 2 and only surfaces on the live domain.
    user: root
    volumes:
      - /opt/helpdeskpro/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/helpdeskpro/certbot-www:/var/www/certbot
      - /etc/letsencrypt/live/helpdesk.4d-gile.com:/etc/letsencrypt/live/helpdesk.4d-gile.com:ro
      - /etc/letsencrypt/archive/helpdesk.4d-gile.com:/etc/letsencrypt/archive/helpdesk.4d-gile.com:ro
    ports:
      - "8081:80"     # the only published port; 80/443 stay with production
    networks:
      helpdesk-test-net:
        aliases: [frontend]

networks:
  helpdesk-test-net:
    name: helpdesk-test-net
    driver: bridge
