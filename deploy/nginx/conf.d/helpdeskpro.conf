# =============================================================================
# HelpDeskPro — production edge reverse proxy
# =============================================================================
# Domain: helpdesk.4d-gile.com  (resolves to 135.125.191.162, an OVH address).
# If you deploy under a different hostname, update every occurrence here AND
# FRONTEND_BASE_URL in .env before issuing certificates.
#
# Stage 1 (now)   : HTTP only. The TLS server block below is commented out so
#                   Nginx starts even though no certificate exists yet.
# Stage 2 (later) : point DNS at the VPS, run deploy/scripts/init-letsencrypt.sh,
#                   then uncomment the HTTPS block and the redirect.
# =============================================================================

upstream helpdeskpro_frontend {
    server frontend:80;
}

upstream helpdeskpro_backend {
    server backend:8080;
}

# ---------------------------------------------------------------------------
# Port 80 — ACME challenges, and (stage 1) the app itself.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.4d-gile.com;   # DOMAIN_PLACEHOLDER

    # Let's Encrypt webroot challenge. Must stay reachable over plain HTTP even
    # after HTTPS is enabled, otherwise renewal breaks.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- STAGE 2: uncomment to force HTTPS, and delete the stage-1 block below.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- STAGE 1 (plain HTTP until the certificate exists) -------------------
    include /etc/nginx/conf.d/helpdeskpro.locations;
}

