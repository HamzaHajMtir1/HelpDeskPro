# HelpDeskPro frontend — Nginx server config for the Docker image.
#
#   browser -> http://localhost:3000 -> this container :80
#                                        |
#                                        |-- /api/  -> http://backend:8080  (Spring Boot)
#                                        |-- /ai/   -> http://agent2:5002   (optional, external)
#                                        `-- /      -> React build, SPA fallback
#
# Plain HTTP only: TLS/Let's Encrypt is a later deployment stage.
# The previous TLS vhost for the public domain is preserved in git history
# (`git show 3346b0f:frontend/nginx.conf`).

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the upstreams below are referenced
    # through variables so they resolve per request instead of at startup.
    resolver 127.0.0.11 ipv6=off valid=30s;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header X-Frame-Options        "SAMEORIGIN"               always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;

    # Ticket/KB attachments are uploaded through this proxy.
    # NOTE: the effective ceiling is Spring Boot's unconfigured multipart
    # default (1MB per file / 10MB per request), which is lower than this.
    # Raising the real limit means setting spring.servlet.multipart.* — an
    # application config change, deliberately not made here.
    client_max_body_size 25m;

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Spring Boot API ---------------------------------------------------
    # All 15 controllers are mapped under /api/** and server.servlet.context-path
    # is not set, so the /api prefix must reach Spring UNCHANGED.
    # $request_uri is the original URI (path + query, percent-encoding intact —
    # attachment filenames depend on that). Do NOT add a trailing slash to
    # proxy_pass and do NOT rewrite here: either would strip /api and 404.
    #
    # The upstream goes through a variable deliberately — with a literal host,
    # Nginx resolves it at startup and aborts with "host not found in upstream"
    # whenever the backend container is not up yet. Via a variable it resolves
    # per request, so the frontend boots independently and returns 502 until
    # the API is reachable.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- optional external AI agent ----------------------------------------
    # The Flask "agent2" service is NOT part of this repository and is not in
    # docker-compose.yml, so these routes return 502 until it is deployed.
    # The prefix is stripped, matching how the frontend calls it
    # (`${FLASK_URL}/agent2/...` -> Flask receives /agent2/...).
    location /ai/ {
        set $agent2_upstream http://agent2:5002;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $agent2_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Agent2 chat streams responses (SSE) — don't buffer them.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- content-hashed Vite assets ----------------------------------------
    # add_header is NOT inherited once a location declares one of its own, so
    # the security headers above are repeated here on purpose.
    location /assets/ {
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"                  always;
        add_header X-Frame-Options        "SAMEORIGIN"               always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    # react-router-dom uses browser-history routes, so deep links and refreshes
    # on e.g. /admin/tickets must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
