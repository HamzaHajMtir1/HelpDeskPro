# SonarQube Cloud namespaces project keys as <Owner>_<Project> and REQUIRES
# sonar.organization; without it the scanner is rejected. Verified against the
# API: organization "hamzahajmtir1", project "HamzaHajMtir1_HelpDeskPro".
sonar.projectKey=HamzaHajMtir1_HelpDeskPro
sonar.organization=hamzahajmtir1
sonar.projectName=HelpDeskPro
sonar.projectVersion=1.0.0

# Scanning a LOCAL SonarQube instead? That instance knows this project as plain
# "HelpDeskPro" and has no organizations, so override both on the command line:
#   docker run --rm -e SONAR_HOST_URL="http://host.docker.internal:9000"
#     -e SONAR_TOKEN=$SONAR_TOKEN -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli
#     "-Dsonar.projectKey=HelpDeskPro" "-Dsonar.organization="
#     "-Dsonar.qualitygate.wait=true"
#   (no trailing backslashes: in a .properties file they are line continuations)

# Verified: sources are genuinely UTF-8 (é encodes as c3 a9), and the backend
# inherits project.build.sourceEncoding=UTF-8 from spring-boot-starter-parent.
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources and tests  (verified to exist)
# -----------------------------------------------------------------------------
#   frontend/src            70 files (57 .jsx, 8 .js)
#   backend/src/main        100 .java + 3 resources
#   backend/src/test        1 .java
#
# backend/src/main is used rather than backend/src/main/java on purpose: it also
# covers src/main/resources, so application*.properties are scanned for
# hardcoded credentials. Narrow it to backend/src/main/java if you want Java only.
sonar.sources=frontend/src,backend/src/main
sonar.tests=backend/src/test

# -----------------------------------------------------------------------------
# Java analysis
# -----------------------------------------------------------------------------
# REQUIRED — without it the Java sensor aborts with
# "Please provide compiled classes of your project with sonar.java.binaries".
# This is why `mvn clean verify` must run BEFORE the scanner.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Matches <java.version>17</java.version> in backend/pom.xml.
sonar.java.source=17

# Third-party classpath. Without this the Java analyser cannot resolve Spring,
# Lombok, JJWT, etc. and guesses at types — the source of SonarCloud's
# "Missing sonar.java.libraries / sonar.java.test.libraries" warnings and of
# imprecise results (false positives + missed real issues).
#
# The JARs are produced in CI by `mvn dependency:copy-dependencies` into
# backend/target/dependency BEFORE the scanner runs (see .github/workflows/ci.yml).
# -DincludeScope=test copies compile + runtime + test deps, so one directory
# serves both the main and the test classpath.
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar

# -----------------------------------------------------------------------------
# Exclusions — build output and vendored code only, never application source
# -----------------------------------------------------------------------------
sonar.exclusions=\
frontend/node_modules/**,\
frontend/dist/**,\
frontend/build/**,\
backend/target/**,\
**/*.min.js,\
**/*.min.css

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
# Backend: produced by jacoco-maven-plugin 0.8.15 (prepare-agent on `initialize`,
# report bound to `verify`) in backend/pom.xml. Verified to exist and to be
# visible inside the scanner container at
# /usr/src/backend/target/site/jacoco/jacoco.xml.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend: NOT configured. frontend/package.json declares no "test" script and
# neither Vitest nor Jest is installed, so no lcov.info is produced. Enable this
# only after a real test runner is added — do not point it at a missing file.
#sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------
sonar.scm.provider=git
